apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpulse
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cloudpulse
  template:
    metadata:
      labels:
        app: cloudpulse
    spec:
      containers:
        - name: cloudpulse
          image: ghcr.io/aryank-droid/cloudpulse:latest
          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: cloudpulse-config

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudpulse-secret
                  key: DB_PASSWORD

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
